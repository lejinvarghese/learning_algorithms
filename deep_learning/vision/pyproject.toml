[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-personal-taste"
version = "1.0.0"
description = "Modern LoRA Fine-tuning Pipeline for Personal Taste Capture"
authors = [
    {name = "AI Art Training Pipeline", email = "example@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
]
keywords = ["machine-learning", "diffusion-models", "lora", "stable-diffusion", "fine-tuning"]

dependencies = [
    "torch>=2.0.1",
    "torchvision>=0.15.2", 
    "transformers>=4.37.0",
    "diffusers>=0.27.0",
    "accelerate>=0.26.0",
    "peft>=0.8.0",
    "bitsandbytes>=0.42.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.20.0",
    "datasets>=2.16.0",
    "Pillow>=10.2.0",
    "opencv-python>=4.9.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "wandb>=0.16.0",
    "tensorboard>=2.15.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "numpy>=1.24.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0", 
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]
notebook = [
    "ipykernel>=6.25.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
gpu = [
    "xformers>=0.0.23",
]

[project.urls]
Homepage = "https://github.com/example/lora-personal-taste"
Repository = "https://github.com/example/lora-personal-taste.git"
Documentation = "https://github.com/example/lora-personal-taste#readme"
"Bug Tracker" = "https://github.com/example/lora-personal-taste/issues"

[project.scripts]
lora-train = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
extend-exclude = '''
/(
  # directories
  \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.isort] 
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "diffusers.*",
    "transformers.*", 
    "peft.*",
    "bitsandbytes.*",
    "wandb.*",
    "cv2.*",
    "sklearn.*",
]
ignore_missing_imports = true