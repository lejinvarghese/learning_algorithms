name: datasets

resources:
  cloud: gcp
  # accelerators: T4:1
  instance_type: n1-highmem-16
  region: us-east1
  zone: us-east1-d


num_nodes: 1

workdir: .

setup: |
  pip install uv
  uv pip install -r requirements_linux.txt
  python -c "import huggingface_hub; huggingface_hub.login('${HF_TOKEN}')"

run: |
  # python processor.py --sample_size 2_000_000 --chunk_size 100_000 --subset_name "triplets" --chunk_suffix "triplets"
  python deduplicator.py --num_partitions 5